<h1 style="margin-top: 10px;">
    <a href="#" style="font-size: 25px;" onclick="mostrar_buscador('{{company.id}}')">
        <i class="bi bi-search"></i>
    </a>
</h1>
    
<h1 style="margin-top: 15px;">
    <a class="dropdown-item compartir_url" href="#"><i class="bi bi-share-fill"></i></a>
</h1>
<style>
    .cantidades-card {
  padding: 6px;
}

/* Ícono */
.cart-icon {
  font-size: 22px;
  color: #ffffff;
  transition: transform 0.2s ease, color 0.2s ease;
}

/* 🔥 Badge pequeño tipo app */
.cart-badge {
  top: 0;
  transform: translate(50%, -40%);
  
  font-size: 17px;
  min-width: 16px;
  height: 18px;
  padding: 0 4px;

  background: #2cf8cc;
  color: #0c0502;

  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 600;
  line-height: 1;
}
</style>
<h1 style="margin-top: 10px;">
    <a href="#"
        class="nav-link position-relative cantidades-card d-inline-flex align-items-center"
        onclick="verCarrito('/{{company.id}}/ver_carrito')"
        data-bs-toggle="modal" data-bs-target="#exampleModal"
        aria-label="Carrito">

        <i class="bi bi-cart-fill cart-icon"></i>

        <span id="cont_compras" class="cart-badge position-absolute"
            {% if total_compra == 0 %}style="display:none"{% endif %}>
            {{ total_compra }}
        </span>
        </a>
</h1>
<script>
    document.querySelectorAll(".compartir_url").forEach(function(btn) {

        btn.addEventListener("click", async function(e) {
    
            e.preventDefault();
    
            const fecha = new Date();
    
            const mes = String(fecha.getMonth() + 1).padStart(2, "0");
            const anio = fecha.getFullYear();
    
            const shareData = {
                title: "Catálogo",
                text: `📋 Catálogo: ${mes}/${anio}\n\nVisita mi tienda online y realiza tu pedido desde cualquier lugar.`,
                url: window.location.href
            };
    
            try {
    
                await navigator.share(shareData);
    
            } catch (err) {
    
                if (err.name !== "AbortError") {
                    console.error("Error al compartir:", err);
                }
    
            }
    
        });
    
    });
</script>
