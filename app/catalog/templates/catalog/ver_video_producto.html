<div class="modal-header  thead-light" style="background-color: #58bba9;">
    <h5 class="modal-title text-white" id="exampleModalLabel">Detalles</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body p-2">

    {% if platform == 'youtube' and video_url %}

        <div class="ratio ratio-16x9">

            <iframe
                class="video-producto"
                src="{{ video_url }}"
                data-src="{{ video_url }}"
                referrerpolicy="strict-origin-when-cross-origin"
                title="Video del producto - YouTube"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    {% elif platform == 'tiktok' and video_url %}

        <div class="d-flex justify-content-center">

            <iframe
                class="video-producto"
                src="{{ video_url }}"
                data-src="{{ video_url }}"
                width="325"
                height="640"
                style="border:0; max-width:100%; border-radius:10px;"
                title="Video del producto - TikTok"
                allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    {% elif platform == 'facebook' and video_url %}

        <div style="width:100%; height:500px;">

            <iframe
                class="video-producto"
                src="{{ video_url }}"
                data-src="{{ video_url }}"
                width="100%"
                height="100%"
                style="border:0;"
                title="Video del producto - Facebook"
                scrolling="yes"
                allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    {% elif platform == 'other' and video_url %}

        <video
            class="video-producto w-100 rounded"
            controls
            style="max-height:600px;">

            <source src="{{ video_url }}">

            Tu navegador no soporta la reproducción de video.

        </video>

        <div class="text-center mt-2">

            <a
                href="{{ raw_video_url }}"
                target="_blank"
                rel="noopener noreferrer">

                Ver video directamente

            </a>

        </div>

    {% else %}

        <div class="alert alert-warning text-center mb-0">

            <i class="bi bi-exclamation-triangle"></i>

            No hay video disponible para este producto.

        </div>

    {% endif %}

</div>
<script>
    // Cuando se cierra el modal, detener el video
    document.addEventListener('hidden.bs.modal', function(event) {

        event.target.querySelectorAll('.video-producto').forEach(function(video) {

            if (video.tagName === 'IFRAME') {

                // Guardamos la URL original si todavía no existe
                if (!video.dataset.src) {
                    video.dataset.src = video.src;
                }

                // Detenemos completamente el iframe
                video.src = 'about:blank';

            } else if (video.tagName === 'VIDEO') {

                video.pause();
                video.currentTime = 0;

            }

        });

    });


    // Cuando se vuelve a abrir el modal, restauramos el video
    document.addEventListener('shown.bs.modal', function(event) {

        event.target.querySelectorAll('.video-producto').forEach(function(video) {

            if (video.tagName === 'IFRAME' && video.dataset.src) {

                video.src = video.dataset.src;

            }

        });

    });
</script>
