<script>
    // La animación del contador empezará solo cuando la sección sea visible en el viewport
    function iniciarContadoresCuandoVisibles() {
        const contadores = document.querySelectorAll(".contador");
        let iniciado = false;

        // Buscar el contenedor/sección del widget del contador
        const seccion = document.querySelector("#count-widget-section") || contadores[0]?.closest("section");

        // Función para animar cada contador individual
        function animarContador(contador) {
            const valorFinal = parseInt(contador.dataset.valor);
            const duracion = 1500;
            const inicio = performance.now();

            function actualizar(tiempo) {
                const progreso = Math.min((tiempo - inicio) / duracion, 1);
                const suavizado = 1 - Math.pow(1 - progreso, 3);
                const valor = Math.floor(valorFinal * suavizado);
                contador.textContent = "+" + valor.toLocaleString();

                if (progreso < 1) {
                    requestAnimationFrame(actualizar);
                } else {
                    contador.textContent = "+" + valorFinal.toLocaleString();
                }
            }

            requestAnimationFrame(actualizar);
        }

        // Usar Intersection Observer para detectar cuando la sección está visible
        if (seccion) {
            const observer = new IntersectionObserver(
                (entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && !iniciado) {
                            contadores.forEach(animarContador);
                            iniciado = true;
                            observer.disconnect();
                        }
                    });
                },
                { threshold: 0.15 }
            );
            observer.observe(seccion);
        } else {
            // Si no se encuentra sección, fallback: animar inmediatamente
            contadores.forEach(animarContador);
        }
    }

    // Ejecutar cuando el DOM esté listo
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", iniciarContadoresCuandoVisibles);
    } else {
        iniciarContadoresCuandoVisibles();
    }
</script>
